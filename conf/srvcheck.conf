; telegram notifications 
[notification.telegram]
enabled = true
apiToken = 
chatIds = 
infoLevelChatId =
warningLevelChatId =
errorLevelChatId =

; a dummy notification wich prints to stdout
[notification.dummy]
enabled = true

; chain settings
[chain]
; name to be displayed on notifications
name = 
; chain type (e.g. "tendermint" | "substrate" | "octra")
type = 
; systemd service name
service = 
; endpoint uri, if different from default
endpoint = 
; block time
blockTime =
activeSet = 
thresholdNotsigned = 
criticalThresholdNotsigned = 
blockWindow = 
; Github repository (org/repo)
ghRepository = 
; software version
localVersion = 
; validator address
validatorAddress = 
; mount point
mountPoint = 

; task specific settings
[tasks]
; comma separated list of disabled tasks
disabled = TaskAutoUpdater, TaskSubstrateNewReferenda
; enable auto recovery
autoRecover = true
; Governance administrator (proposal voting, with @)
govAdmin =
; Prometheus exporter port
exporterPort =

; octra specific settings
[octra]
; minimum number of consensus peers before alerting
minConsensusPeers = 4
; consecutive checks (5 min apart) with voting disabled before alerting
votingDisabledChecks = 2
